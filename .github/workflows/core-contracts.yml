name: Foundry core contracts

on:
  pull_request:
    paths:
      - 'constraint_graph.py'
      - 'tests/**'
      - '.github/workflows/core-contracts.yml'

permissions:
  contents: read

concurrency:
  group: constraint-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic contracts
        run: python -m unittest discover -s tests -v
